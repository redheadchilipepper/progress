<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #191919;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      padding-left: 6px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 190px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Pill capsule matching clock/card borders & background */
    .bar-track {
      width: 72px;
      height: 22px;
      background-color: #2c2c2c;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    /* Moving progress fill */
    .bar-fill {
      height: 100%;
      width: 0%;
      background-color: #e3ded2; /* Cream/warm parchment fill */
      border-radius: 4px 0 0 4px;
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Labels styled in all-lowercase to match "terra hub" */
    .progress-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.81);
      letter-spacing: -0.01em;
      white-space: nowrap;
      text-transform: lowercase;
    }
  </style>
</head>
<body>

  <div class="progress-container">
    <div class="progress-row">
      <div class="bar-track">
        <div class="bar-fill" id="year-bar"></div>
      </div>
      <span class="progress-label" id="year-label">year: 0%</span>
    </div>

    <div class="progress-row">
      <div class="bar-track">
        <div class="bar-fill" id="month-bar"></div>
      </div>
      <span class="progress-label" id="month-label">month: 0%</span>
    </div>

    <div class="progress-row">
      <div class="bar-track">
        <div class="bar-fill" id="week-bar"></div>
      </div>
      <span class="progress-label" id="week-label">week: 0%</span>
    </div>

    <div class="progress-row">
      <div class="bar-track">
        <div class="bar-fill" id="day-bar"></div>
      </div>
      <span class="progress-label" id="day-label">day: 0%</span>
    </div>
  </div>

  <script>
    function updateProgress() {
      const now = new Date();

      // Year Progress
      const startOfYear = new Date(now.getFullYear(), 0, 1);
      const endOfYear = new Date(now.getFullYear() + 1, 0, 1);
      const yearPct = Math.floor(((now - startOfYear) / (endOfYear - startOfYear)) * 100);

      // Month Progress
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      const monthPct = Math.floor(((now - startOfMonth) / (endOfMonth - startOfMonth)) * 100);

      // Week Progress (Monday - Sunday)
      const currentDay = now.getDay();
      const mondayOffset = (currentDay === 0 ? -6 : 1) - currentDay;
      const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset);
      startOfWeek.setHours(0, 0, 0, 0);
      const endOfWeek = new Date(startOfWeek.getTime() + 7 * 24 * 60 * 60 * 1000);
      const weekPct = Math.floor(((now - startOfWeek) / (endOfWeek - startOfWeek)) * 100);

      // Day Progress (00:00 - 23:59)
      const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      const dayPct = Math.floor(((now - startOfDay) / (endOfDay - startOfDay)) * 100);

      // Set values
      setBar('year', yearPct, 'year');
      setBar('month', monthPct, 'month');
      setBar('week', weekPct, 'week');
      setBar('day', dayPct, 'day');
    }

    function setBar(id, percent, label) {
      const clamped = Math.min(100, Math.max(0, percent));
      document.getElementById(`${id}-bar`).style.width = clamped + '%';
      document.getElementById(`${id}-label`).textContent = `${label}: ${clamped}%`;
    }

    setTimeout(updateProgress, 100);
    setInterval(updateProgress, 60000);
  </script>
</body>
</html>
